[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koa-severity-classification"
version = "0.8.0"
description = "Research utilities for 5-class knee osteoarthritis severity classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "seaborn",
  "pillow",
  "opencv-python",
  "joblib",
  "kagglehub",
  "torch",
  "torchvision",
  "timm",
  "xgboost",
  "lightgbm",
  "python-docx",
  "pydicom<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
